plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}
android {
    namespace 'com.nemesis.apk'
    compileSdk 34
    defaultConfig {
        applicationId 'com.nemesis.apk'
        minSdk 26
        targetSdk 28
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' }
        versionCode 10
        versionName '0.1.0-beta.9'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    // GitHub sideload beta: retain targetSdk 28 for the existing /sdcard/Nemesis storage contract.
    // Google Play distribution needs a separate storage migration and target SDK upgrade.
    lint { disable 'ExpiredTargetSdkVersion' }
    packagingOptions { jniLibs { useLegacyPackaging true } }
}
chaquopy {
    defaultConfig {
        version = '3.11'
        pip { install 'requests==2.32.4' }
    }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation project(':nemapi-embedded')
    implementation 'com.github.mwiede:jsch:0.2.20'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
android { packaging { resources { excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'] } } }
